basePath: /api
host: localhost:8000
info:
  contact: {}
  description: API for file upload management
  title: File Upload API
  version: "1.0"
paths:
  /api/users/{id}:
    delete:
      description: Deletes a user by their ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: no content
        "500":
          description: failed deleting user
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - Users
schemes:
- http
- https
swagger: "2.0"
